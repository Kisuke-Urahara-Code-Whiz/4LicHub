services:
  postgres:
    image: postgres:15.18
    container_name: postgres
    restart: unless-stopped

    ports:
      - "9000:5432"

    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: _LicHub

    volumes:
      - postgres_data:/var/lib/postgresql/data

  playerService:
    build: ./playerService
    image: players-service:1.0.1
    container_name: playerService

    ports:
      - "5000:5000"

    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_NAME: _LicHub
      DB_USERNAME: dev
      DB_PASSWORD: dev
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      - postgres

volumes:
  postgres_data:
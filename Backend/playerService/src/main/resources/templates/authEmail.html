<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="EN-US">
<head>
    <meta charset="UTF-8">
    <title>Your One-Time Password</title>
</head>
<body style="font-family: Helvetica, Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 40px 0;">

<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">

    <h2 style="color: #333333; margin-top: 0;">Security Verification</h2>

    <p style="color: #555555; font-size: 16px; line-height: 1.5;">
        Hi <span th:text="${userName}">User</span>,
    </p>

    <p style="color: #555555; font-size: 16px; line-height: 1.5;">
        Please use the following One-Time Password (OTP) to complete your verification process.
        <strong>This code is valid for <span>10</span> minutes.</strong>
    </p>

    <div style="background-color: #f8f9fa; border: 1px dashed #cccccc; border-radius: 4px; padding: 20px; text-align: center; margin: 30px 0;">
            <span style="font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #0056b3;" th:text="${otpCode}">
                000000
            </span>
    </div>

    <p style="color: #888888; font-size: 14px; line-height: 1.5;">
        If you did not request this code, please ignore this email or contact support if you have concerns. Never share this code with anyone.
    </p>

</div>

</body>
</html>
